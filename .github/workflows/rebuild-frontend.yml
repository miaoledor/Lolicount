name: Rebuild Frontend

# When built-in theme assets change on the default branch, rebuild the
# Nuxt static site to validate the new assets, then commit the regenerated
# theme manifest. The SSG output is built by CI and release packaging;
# generated frontend files are intentionally not tracked in Git.

on:
  push:
    branches: [main, master]
    paths:
      - assets/theme/**
      - assets/f-theme/**
      - assets/themes.json

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild SSG
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Regenerate themes.json
        run: node scripts/gen-themes-json.js

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Test frontend behavior
        run: pnpm test:frontend
      - name: Build frontend
        run: pnpm generate
        working-directory: web

      - name: Commit regenerated themes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/themes.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci(frontend): regenerate themes.json after theme change"
            git push
          fi
