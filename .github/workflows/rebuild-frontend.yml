name: Rebuild Frontend

# When built-in theme assets change on the default branch, rebuild the
# Nuxt static site so the theme gallery reflects the new assets, then
# commit the regenerated dist back. This keeps the embedded frontend in
# sync with theme contributions.

on:
  push:
    branches: [main, master]
    paths:
      - assets/theme/**
      - assets/character/**
      - assets/f-theme/**
      - assets/themes.json

permissions:
  contents: write

jobs:
  rebuild:
    name: Rebuild SSG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Regenerate themes.json
        run: node scripts/gen-themes-json.js

      - name: Install frontend deps
        run: pnpm install --config.dangerouslyAllowAllBuilds=true
        working-directory: web
      - name: Build frontend
        run: pnpm generate
        working-directory: web

      - name: Commit regenerated themes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/themes.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ci(frontend): regenerate themes.json after theme change"
            git push
          fi
