name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet + test
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Reuse this run's verified SSG output so embedded-page tests run
      # against the frontend artifact instead of silently skipping.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-dist
          path: assets/dist
      - run: go vet ./...
      - run: go test -race -count=1 -p 1 ./...

  check-theme:
    name: Theme integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/check-theme

  frontend:
    name: Nuxt build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend
      - run: pnpm generate
        working-directory: web
      - name: Verify prerendered pages
        run: |
          test -f web/.output/public/index.html
          test -f web/.output/public/about/index.html
          test -f web/.output/public/support/index.html
      - name: Upload frontend dist for Go tests
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-dist
          path: web/.output/public/
          if-no-files-found: error
          retention-days: 1
