name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Build the frontend SSG into assets/dist before testing so the
      # embedded dist (served by the frontend handler) is non-empty, same
      # as a release build. Without this, frontend/SPA tests 404 because
      # assets/dist only has .gitkeep in the repo.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --config.dangerouslyAllowAllBuilds=true
        working-directory: web
      - run: pnpm generate
        working-directory: web
      - run: cp -r web/dist/* assets/dist/
      - run: go vet ./...
      - run: go test -race -count=1 -p 1 ./...

  check-theme:
    name: Theme integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run ./cmd/check-theme

  frontend:
    name: Nuxt build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --config.dangerouslyAllowAllBuilds=true
        working-directory: web
      - run: pnpm generate
        working-directory: web
