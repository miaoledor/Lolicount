name: Release

# On a version tag v*, build the frontend, compile a static Go binary
# with the embedded dist, and push a Docker image to ghcr.io.
#
# This workflow deliberately does NOT publish a GitHub Release, so pushing
# a tag will not notify stargazers. To announce a release, go to
# Releases → Draft a new release, pick the pushed tag, and publish manually.
# Only that manual step triggers stargazer notifications.

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm install --config.dangerouslyAllowAllBuilds=true
        working-directory: web
      - name: Build frontend (SSG)
        # BASE_URL is baked into the SSG bundle so embed links point at the
        # public domain. Set it as a GitHub Actions variable (Settings →
        # Secrets and variables → Actions → Variables → BASE_URL).
        env:
          NUXT_PUBLIC_BASE_URL: ${{ vars.BASE_URL }}
        run: pnpm generate
        working-directory: web

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Copy frontend dist for embed
        run: cp -r web/dist/* assets/dist/
      - name: Build Go binary
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o lolicount ./cmd/server

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=${{ vars.BASE_URL }}
