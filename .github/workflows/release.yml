name: Release

# On a version tag v*, use the Dockerfile to test/build the frontend and
# compile the embedded Go binary once, then push the image to ghcr.io.
#
# This workflow deliberately does NOT publish a GitHub Release, so pushing
# a tag will not notify stargazers. To announce a release, go to
# Releases → Draft a new release, pick the pushed tag, and publish manually.
# Only that manual step triggers stargazer notifications.

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_URL=${{ vars.BASE_URL }}
            APP_VERSION=${{ github.ref_name }}
