services:
  app:
    # Pre-built image from ghcr.io (built by release.yml on tag v*).
    # For local source builds, replace with `build: .` and `image: lolicount:latest`.
    image: ghcr.io/miaoledor/lolicount:latest
    container_name: lolicount
    restart: unless-stopped
    ports:
      - "9721:9721"
    volumes:
      - lolicount-data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 9721
      LOG_LEVEL: info
      DB_PATH: /app/data/count.db
      DB_INTERVAL: 10
      RATE_LIMIT_IP_PER_SEC: 10
      RATE_LIMIT_IP_PER_MIN: 300
      RATE_LIMIT_NAME_PER_SEC: 5
      # Public domain for embed links. The backend rewrites this into the
      # served index.html at runtime (no rebuild needed), and also exposes
      # it at GET /api/config. Set to your real domain, e.g.
      #   BASE_URL: https://lolicount.top
      # Or via shell: export BASE_URL=https://lolicount.top && docker compose up -d
      BASE_URL: ${BASE_URL:-}
    # Single instance + SQLite (AGENTS.md Iron Rule 5). No redis.

volumes:
  lolicount-data:
